name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A superseded run tells you nothing useful, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./ui

      - name: Lint
        run: pnpm run lint
        working-directory: ./ui

      - name: Typecheck
        run: pnpm run typecheck
        working-directory: ./ui

      # Covers both the UI and the dependency-free modules in ../api.
      - name: Test
        run: pnpm run test
        working-directory: ./ui

      - name: Build
        run: pnpm run build:prod
        working-directory: ./ui
