name: CI

# Pull requests only. Deploy is what ships a push to main, and it runs the
# build itself, so re-running these checks there duplicates work.
on:
  pull_request:

# A superseded run tells you nothing useful, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./ui

      - name: Lint
        run: pnpm run lint
        working-directory: ./ui

      - name: Typecheck
        run: pnpm run typecheck
        working-directory: ./ui

      # Covers both the UI and the dependency-free modules in ../api.
      - name: Test
        run: pnpm run test
        working-directory: ./ui

      - name: Build
        run: pnpm run build:prod
        working-directory: ./ui
